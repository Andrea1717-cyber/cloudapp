<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: lightblue;
            color: darkblue;
            text-align: center;
            padding-top: 60px;
        }

        .contenedor{
            background: white;
            width: 60%;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            color: #0077cc;
        }

        p{
            font-size: 18px;
        }

        form{
            margin-top: 20px;
        }

        input, button{
            padding: 10px;
            margin: 5px;
        }

        table{
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }

        table, th, td{
            border: 1px solid darkblue;
            padding: 10px;
        }

        th{
            background-color: #0077cc;
            color: white;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Proyecto Andrea Castro</h1>

        <p><strong>Adso:</strong> 35</p>
        <p>La aplicación funciona correctamente.</p>
        <p>Servidor funcionando 24/7 desde internet.</p>
        <p id="fecha"></p>

        <!-- Formulario -->
        <form>
            <label>Nombre:</label>
            <input type="text" name="nombre" placeholder="Escribe tu nombre">
            <button type="submit">Enviar</button>
        </form>

        <!-- Tabla -->
        <table>
            <tr><th>Estudiante</th><th>Nota</th></tr>
            <tr><td>Ana</td><td>5.0</td></tr>
            <tr><td>Carlos</td><td>4.5</td></tr>
            <tr><td>Andrea</td><td>5.0</td></tr>
        </table>
    </div>

    <script>
        const fecha = new Date();
        document.getElementById("fecha").innerHTML =
            "Fecha y hora: " + fecha;
    </script>

</body>
</html>
